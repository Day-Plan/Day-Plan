[package]
name = "day-plan"
version.workspace = true
edition = "2024"
license = "GPL-2.0-or-later"
repository = "https://github.com/Day-Plan/Day-Plan"
description = "Offline notes, tasks and lists with WebDAV synchronization"

[features]
# `mock` keeps bare cargo and rust-analyzer compiling; `day build` overrides it with
# `--no-default-features --features <backend>` (https://daybrite.dev/docs/reference/project-structure).
default = ["mock"]
appkit = ["day/appkit"]
gtk = ["day/gtk"]
qt = ["day/qt"]
uikit = ["day/uikit"]
material = ["day/material"]
winui = ["day/winui"]
arkui = ["day/arkui"]
dom = ["day/dom"]
mock = ["day/mock"]

# Cargo defaults to rlib; the mobile pipeline requests staticlib/cdylib via `cargo rustc`.
[lib]
# A constant lib name: staged artifacts and the `dayapp::` import never move on a package rename.
name = "dayapp"

[dependencies]
day = { package = "day-app", version = "0.*", features = ["model"] }
day-piece-settings = "0.*"
day-persistence = "0.*"
day-sync = { version = "0.*", git = "https://github.com/daybrite/day-sync.git" }
day-sync-webdav = { version = "0.*", git = "https://github.com/daybrite/day-sync.git" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
day-part-keychain = "0.*"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
sha2 = "0.11"

[dev-dependencies]
futures-lite = "2"
tempfile = "3"
day-webdav = { git = "https://github.com/daybrite/day-webdav.git", features = ["demo-server"] }

[build-dependencies]
day-build = { version = "0.*" }

# Lint policy: Clippy's default lints plus a short list that catches defects rather than style.
# The project's CI treats every warning as an error (`cargo clippy --all-targets -- -D warnings`),
# so a finding blocks the change that introduced it. Fix findings in the code; for a site where
# the lint is wrong, use `#[expect(clippy::<lint>, reason = "…")]`. A stricter table, up to
# Clippy's `pedantic` group, is the project's choice; keep these lines in it.
[lints.clippy]
# Debugging and placeholder macros do not ship.
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
# Every `unsafe` block states why it is sound in a `// SAFETY:` comment.
undocumented_unsafe_blocks = "warn"
# `unwrap()` aborts the app with no explanation. Return the error, or use `expect("…")` with the
# invariant that makes the failure impossible. Tests are exempt (clippy.toml).
unwrap_used = "warn"


[workspace]

[workspace.package]
version = "1.0.0"

[package.metadata.day.web]
modules = ["platform/web/calendar.js"]
