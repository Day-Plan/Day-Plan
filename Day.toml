# The Day project manifest: https://daybrite.dev/docs/reference/cli#the-conventional-project
# `name` and `version` come from Cargo.toml.
schema = 1

[app]
id = "org.appfair.app.SkipNotes"
title = "Day-Plan"
build = 62
artifact = "day-plan"
targets = ["macos-appkit", "ios-uikit", "android-material", "linux-gtk", "linux-qt", "windows-winui", "harmony-arkui", "web-dom"]

[web]
cross-origin-isolation = true

# The window's size and minimum size in points, for every platform with resizable windows.
[window]
width = 1220
height = 800
min_width = 320
min_height = 400

# Report which element ids the dayscripts reach: https://daybrite.dev/docs/how-to/dayscript
[dayscript.coverage]
enabled = true

[store]
apple-app-id = "6740916318"
google-play-id = "org.appfair.app.SkipNotes"

[sandbox.macos-appkit]
enabled = true
network-client = true
bookmarks = false
user-selected-files = "none"
